spring.application.name=baozi-store-api
server.port=8080

# Banco relacional H2 em arquivo local para preservar os dados entre reinicializações.
spring.datasource.url=jdbc:h2:file:./baozi-storespring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console de desenvolvimento (não habilitar em produção sem avaliar os riscos).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
